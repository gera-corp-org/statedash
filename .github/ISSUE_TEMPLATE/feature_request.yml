name: Feature request
description: Suggest something Statedash should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](../blob/HEAD/ROADMAP.md) first — several ideas
        are already written down there together with the reasoning for
        postponing them. Adding to an existing entry is more useful than opening
        a duplicate.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: >
        The situation you are in, not the solution you have in mind. It is
        usually the more useful half.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you would like to see

  - type: dropdown
    id: privileges
    attributes:
      label: Would this need extra OPNsense privileges?
      description: >
        Statedash deliberately asks for a small set. Anything requiring more has
        to work without them too, so the section simply stays hidden.
      options:
        - "No — uses what is already read"
        - "Yes — needs an additional privilege"
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: contributing
    attributes:
      label: Would you like to build it?
      options:
        - label: >
            I am willing to open a pull request. I understand contributions are
            covered by the CLA in CONTRIBUTING.md, which keeps the project's
            dual licence workable.
