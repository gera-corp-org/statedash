name: sign-off

# The commercial licence in LICENSING.md can only be granted by someone holding
# the rights to all of the code. A single commit merged without a sign-off would
# make it ungrantable for the project as a whole, so this check gates every pull
# request. Make it a required check in the branch protection rules.

on:
  pull_request:

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the whole range of the pull request has to be walked, not just its tip
          fetch-depth: 0

      - name: Every commit carries Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0

          for sha in $(git rev-list "$BASE..$HEAD"); do
            subject=$(git log -1 --format='%s' "$sha")
            author=$(git log -1 --format='%ae' "$sha")
            short=$(git rev-parse --short "$sha")

            # merge commits are made by GitHub itself and carry no sign-off
            if [ "$(git rev-list --parents -n1 "$sha" | wc -w)" -gt 2 ]; then
              echo "skipped (merge)  $short  $subject"
              continue
            fi

            signer=$(git log -1 --format='%B' "$sha" \
                     | grep -iE '^[[:space:]]*Signed-off-by:[[:space:]]*.+<.+@.+>' \
                     | tail -1 | sed -E 's/.*<(.+)>.*/\1/')

            if [ -z "$signer" ]; then
              echo "NO SIGN-OFF      $short  $subject"
              missing=$((missing + 1))
            elif [ "$signer" != "$author" ]; then
              echo "MISMATCH         $short  $subject"
              echo "                 author is $author, signed off by $signer"
              missing=$((missing + 1))
            else
              echo "ok               $short  $subject"
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo
            echo "All commits are signed off."
            exit 0
          fi

          echo
          echo "─────────────────────────────────────────────────────────────"
          echo "$missing commit(s) have no valid Signed-off-by line."
          echo
          echo "Statedash is dual-licensed (see LICENSING.md). The sign-off is"
          echo "how you confirm the Contributor Licence Agreement described in"
          echo "CONTRIBUTING.md. You keep the copyright on your work — it only"
          echo "lets the maintainer sublicense it, which is what keeps the"
          echo "commercial licence possible."
          echo
          echo "To fix the whole branch:"
          echo "    git rebase --signoff ${{ github.event.pull_request.base.ref }}"
          echo "    git push --force-with-lease"
          echo
          echo "For a single commit:"
          echo "    git commit --amend -s"
          echo "    git push --force-with-lease"
          echo
          echo "The e-mail in the sign-off must match the commit author."
          echo "─────────────────────────────────────────────────────────────"
          exit 1
