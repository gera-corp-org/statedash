name: chart

# Publishes the Helm chart as an OCI artifact to the same registry as the image.
# Artifact Hub indexes it straight from there — no gh-pages branch, no index.yaml.

on:
  push:
    # An application tag publishes the chart too, so releasing is one action.
    # chart-* stays for the rare fix that touches only the templates.
    tags: ["v*", "chart-*"]
  pull_request:
    paths: ["charts/**"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # not on the runner by default, and the metadata push needs it
      - uses: oras-project/setup-oras@v2

      - name: Lint and render
        run: |
          helm lint charts/statedash --strict
          # every conditional path, so a broken template cannot reach the registry
          helm template t charts/statedash --set opnsense.url=https://fw:4443 > /dev/null
          helm template t charts/statedash --set persistence.enabled=false > /dev/null
          helm template t charts/statedash --set opnsense.existingSecret=s > /dev/null
          helm template t charts/statedash --set ingress.enabled=true \
                                           --set networkPolicy.enabled=true > /dev/null

      - name: Check the chart and the app agree
        # Skipped on an application tag: the image for it is being built by the
        # other workflow right now, so demanding that it already exists would
        # fail every release.
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          # appVersion has to name a real image, or an install pulls nothing
          app=$(helm show chart charts/statedash | awk '/^appVersion:/ {print $2}' | tr -d '"')
          echo "appVersion: $app"
          docker manifest inspect "ghcr.io/${{ github.repository }}:$app" > /dev/null

      # a pull request only checks; it never pushes
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/chart-')
        run: |
          # v1.3.0 publishes chart 1.3.0 for application 1.3.0 — one number, so
          # the chart cannot be left behind by a release. chart-1.3.1 publishes
          # 1.3.1 against whatever appVersion Chart.yaml names, for a fix that
          # touches the templates alone.
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            app_args=(--app-version "$version")
          else
            version="${GITHUB_REF_NAME#chart-}"
            app_args=()
          fi
          helm package charts/statedash --version "$version" "${app_args[@]}" -d /tmp
          helm push "/tmp/statedash-${version}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

      # Also on a manual run: the claim is independent of the chart version, so a
      # correction to it should not need a release nobody asked for.
      - name: Push the Artifact Hub ownership metadata
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          # Artifact Hub looks for this beside the chart in the registry. It is
          # skipped while the id is still a placeholder, so a half-filled file
          # never claims ownership of somebody else's listing.
          if grep -q REPLACE_WITH_ARTIFACT_HUB_ID charts/statedash/artifacthub-repo.yml; then
            echo "repositoryID not filled in yet — skipping"
            exit 0
          fi
          oras push \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/statedash:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+json \
            charts/statedash/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
