name: image

on:
  push:
    # both names are listed so the workflow keeps working whichever one the
    # default branch ends up being
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  schedule:
    # Monthly. The IPv4-to-country database is downloaded during the build, so
    # rebuilding on a timer is what keeps it fresh — see ROADMAP.md.
    - cron: "0 5 1 * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

# a new push supersedes a running build of the same ref, except on the default
# branch where every commit should produce its image
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # arm64 is built through emulation; the dependencies ship as musllinux
      # wheels, so nothing is compiled and the penalty stays small
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # a pull request from a fork cannot be trusted with registry credentials,
      # so those builds only check that the image still builds
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Statedash
            org.opencontainers.image.description=Network traffic dashboard for OPNsense
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        # only the native architecture can run on the runner
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load --platform linux/amd64 -t statedash:test ./backend
          docker run -d --name test -e MOCK=1 -p 8080:8080 statedash:test
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/static/app.js && break
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8080/static/app.js
          docker exec test python -c "
          import sys; sys.path.insert(0, '/srv')
          from app import geo
          assert len(geo._starts) > 100000, 'geo database did not load'
          assert geo.lookup('8.8.8.8')['code'] == 'US', 'geo lookup is wrong'
          print('geo ok:', len(geo._starts), 'ranges')
          "
          docker rm -f test
