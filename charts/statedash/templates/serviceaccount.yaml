{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "statedash.serviceAccountName" . }}
  labels: {{- include "statedash.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# Statedash never calls the Kubernetes API, so its token is not mounted
automountServiceAccountToken: false
{{- end }}
