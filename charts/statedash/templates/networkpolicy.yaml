{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "statedash.fullname" . }}
  labels: {{- include "statedash.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "statedash.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS, or the firewall's hostname never resolves
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.egressCIDRs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
