apiVersion: v2
name: statedash
description: Network traffic dashboard for OPNsense — active hosts, connections, a firewall rule map and WireGuard peers
type: application

# The two move together: an application tag publishes a chart of the same
# number, so there is one version to think about and no way to release the
# application and forget the chart. The cost is that a template-only fix also
# takes an application version — rare enough to be worth the simplicity.
#
# The release workflow overrides both from the tag; the values here are what a
# local `helm package` produces.
version: 1.8.2
appVersion: "1.8.2"

home: https://github.com/gera-corp-org/statedash
sources:
  - https://github.com/gera-corp-org/statedash
icon: https://raw.githubusercontent.com/gera-corp-org/statedash/master/docs/logo.svg
keywords:
  - opnsense
  - firewall
  - networking
  - monitoring
  - wireguard
maintainers:
  - name: gera-corp
    email: exandore@gmail.com
    url: https://github.com/gera-corp-org
annotations:
  # Artifact Hub reads these when the chart is listed there
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-or-later
  artifacthub.io/links: |
    - name: live demonstration
      url: https://demo.statedash.geracorp.org
    - name: source
      url: https://github.com/gera-corp-org/statedash
    - name: container image
      url: https://github.com/gera-corp-org/statedash/pkgs/container/statedash
    - name: changelog
      url: https://github.com/gera-corp-org/statedash/blob/master/CHANGELOG.md
  artifacthub.io/images: |
    - name: statedash
      image: ghcr.io/gera-corp-org/statedash:1.8.2
  # The chart is signed with cosign on release; this is the public half, so a
  # download can be checked against it:
  #   cosign verify --key cosign.pub ghcr.io/gera-corp-org/charts/statedash:VERSION
  # The fingerprint is the SHA-256 of cosign.pub itself — cosign keys have no
  # fingerprint of their own the way a PGP key does.
  artifacthub.io/signKey: |
    fingerprint: 17554f1f84f3e2b5b77e1d6d321d3b8f2034e1eebbf97393e877423127fa238d
    url: https://raw.githubusercontent.com/gera-corp-org/statedash/master/charts/statedash/cosign.pub
  artifacthub.io/maintainers: |
    - name: gera-corp
      email: exandore@gmail.com
  artifacthub.io/screenshots: |
    - title: Active hosts
      url: https://raw.githubusercontent.com/gera-corp-org/statedash/master/docs/statedash-hosts.png
    - title: Traffic map through firewall rules and NAT
      url: https://raw.githubusercontent.com/gera-corp-org/statedash/master/docs/statedash-rules.png
    - title: Connections of one host
      url: https://raw.githubusercontent.com/gera-corp-org/statedash/master/docs/statedash-connections.png
    - title: WireGuard peers
      url: https://raw.githubusercontent.com/gera-corp-org/statedash/master/docs/statedash-wireguard.png
    - title: Blocked traffic
      url: https://raw.githubusercontent.com/gera-corp-org/statedash/master/docs/statedash-blocked.png
  artifacthub.io/changes: |
    - kind: added
      description: First release of the chart
